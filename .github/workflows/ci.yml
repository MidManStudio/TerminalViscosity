name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ODIN_TAG: dev-2026-10

jobs:
  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.75.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build server
        run: cargo build --release -p tv_server
      - name: Same seed must give identical output in separate processes
        run: |
          ./target/release/tv_server selftest --seed 1 --ticks 3600 > run_a.txt
          ./target/release/tv_server selftest --seed 1 --ticks 3600 > run_b.txt
          cat run_a.txt
          diff run_a.txt run_b.txt
      - name: Different seeds must give different output
        run: |
          ./target/release/tv_server selftest --seed 2 --ticks 3600 > run_c.txt
          ! diff -q run_a.txt run_c.txt

  docs:
    name: documentation rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check headers and docs
        run: python3 scripts/check_headers.py

  odin:
    name: odin client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libgl-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev xvfb libgl1-mesa-dri libglx-mesa0 glslang-tools
      - name: Install Odin ${{ env.ODIN_TAG }}
        run: |
          curl -sSL "https://github.com/odin-lang/Odin/releases/download/${ODIN_TAG}/odin-linux-amd64-${ODIN_TAG}.tar.gz" | tar xz
          odin_dir="$(find "$PWD" -maxdepth 1 -type d -name 'odin-linux-amd64-*' | head -n 1)"
          echo "$odin_dir" >> "$GITHUB_PATH"
      - name: Odin version
        run: odin version
      - name: Type-check client
        run: odin check client/src -vet -strict-style
      - name: Soft-body tests
        run: odin test client/src/softbody -vet -strict-style
      - name: Balloon tests
        run: odin test client/src/balloon -vet -strict-style
      - name: Lab tests
        run: odin test client/src/lab -vet -strict-style
      - name: Carry tests
        run: odin test client/src/carry -vet -strict-style
      - name: Chemistry tests
        run: odin test client/src/chem -vet -strict-style
      - name: Liquid simulation tests
        run: odin test client/src/mpm -vet -strict-style
      - name: Store tests with a stand-in DixScript library
        run: |
          mkdir -p build
          cc -shared -fPIC -o build/libfake_mdix.so client/src/store/testdata/fake_mdix_ffi.c
          TV_MDIX_FAKE_LIB="$PWD/build/libfake_mdix.so" odin test client/src/store -vet -strict-style
      - name: Store tests with the real DixScript library
        run: |
          # DixScript's own CI publishes this build in its repository. The same
          # commit and checksum as scripts/build_android.sh, for Linux.
          curl -sSfL -o build/libmdix_ffi.so "https://raw.githubusercontent.com/Mid-D-Man/DixScript-Rust/35ae2d23a62a0ad6b97ca0016fda0ef01c8e0584/com.midmanstudio.mdix/Runtime/Plugins/Linux/x86_64/libmdix_ffi.so"
          echo "23341d054ee3b4a1866403ca96f176d1153beac105487b29d1befe0605e2b5e1  build/libmdix_ffi.so" | sha256sum -c -
          TV_MDIX_LIB="$PWD/build/libmdix_ffi.so" odin test client/src/store -vet -strict-style
      - name: Validate shaders
        run: |
          glslangValidator -S frag client/shaders/glsl330/heat_distort.fs
          glslangValidator -S frag client/shaders/glsl100/heat_distort.fs
          glslangValidator -S vert client/shaders/glsl330/balloon.vs
          glslangValidator -S frag client/shaders/glsl330/balloon.fs
          glslangValidator -S vert client/shaders/glsl100/balloon.vs
          glslangValidator -S frag client/shaders/glsl100/balloon.fs
          glslangValidator -S vert client/shaders/glsl330/lab.vs
          glslangValidator -S frag client/shaders/glsl330/lab.fs
          glslangValidator -S vert client/shaders/glsl100/lab.vs
          glslangValidator -S frag client/shaders/glsl100/lab.fs
          glslangValidator -S frag client/shaders/glsl330/vessel.fs
          glslangValidator -S frag client/shaders/glsl100/vessel.fs
      - name: Build client and run selftest
        run: bash scripts/build_client.sh --selftest
      - name: Headless render, lab room
        working-directory: build
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./tv_client --fixed-step --frames 240 --screenshot lab.png
      - name: Headless render, balloon held by its tip
        working-directory: build
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./tv_client --fixed-step --scene balloon --demo hang --frames 330 --screenshot lab_hang.png
      - uses: actions/upload-artifact@v4
        with:
          name: lab-screenshot
          path: |
            build/lab.png
            build/lab_hang.png
