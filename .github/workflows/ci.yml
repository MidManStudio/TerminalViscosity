name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ODIN_TAG: dev-2026-10

jobs:
  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.75.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build server
        run: cargo build --release -p tv_server
      - name: Same seed must give identical output in separate processes
        run: |
          ./target/release/tv_server selftest --seed 1 --ticks 3600 > run_a.txt
          ./target/release/tv_server selftest --seed 1 --ticks 3600 > run_b.txt
          cat run_a.txt
          diff run_a.txt run_b.txt
      - name: Different seeds must give different output
        run: |
          ./target/release/tv_server selftest --seed 2 --ticks 3600 > run_c.txt
          ! diff -q run_a.txt run_c.txt

  docs:
    name: documentation rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check headers and docs
        run: python3 scripts/check_headers.py

  odin:
    name: odin client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libgl-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev xvfb libgl1-mesa-dri libglx-mesa0 glslang-tools
      - name: Install Odin ${{ env.ODIN_TAG }}
        run: |
          curl -sSL "https://github.com/odin-lang/Odin/releases/download/${ODIN_TAG}/odin-linux-amd64-${ODIN_TAG}.tar.gz" | tar xz
          odin_dir="$(find "$PWD" -maxdepth 1 -type d -name 'odin-linux-amd64-*' | head -n 1)"
          echo "$odin_dir" >> "$GITHUB_PATH"
      - name: Odin version
        run: odin version
      - name: Type-check client
        run: odin check client/src -vet -strict-style
      - name: Soft-body tests
        run: odin test client/src/softbody -vet -strict-style
      - name: Validate shaders
        run: |
          glslangValidator -S frag client/shaders/glsl330/heat_distort.fs
          glslangValidator -S frag client/shaders/glsl100/heat_distort.fs
      - name: Build client and run selftest
        run: bash scripts/build_client.sh --selftest
      - name: Headless render
        working-directory: build
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./tv_client --frames 240 --screenshot lab.png
      - uses: actions/upload-artifact@v4
        with:
          name: lab-screenshot
          path: build/lab.png
